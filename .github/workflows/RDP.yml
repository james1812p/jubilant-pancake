name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: cmd
        run: |
          net user RDP "AdminPass2026!#" /add /y
          net localgroup Administrators RDP /add
          net localgroup "Remote Desktop Users" RDP /add
          echo RDP_PASS=AdminPass2026!#>> %GITHUB_ENV%
          echo User created successfully.

      - name: Install Tailscale
        shell: powershell
        run: |
          curl.exe -fsSL "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -o "$env:TEMP\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "`"$env:TEMP\tailscale.msi`"", "/quiet", "/norestart" -Wait
          Remove-Item "$env:TEMP\tailscale.msi" -Force

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          $authKey = "${{ secrets.TAILSCALE_AUTH_KEY }}"
          if ([string]::IsNullOrWhiteSpace($authKey)) {
              Write-Error "CRITICAL: TAILSCALE_AUTH_KEY secret is missing or empty in GitHub repository settings!"
              exit 1
          }

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$authKey --accept-routes --hostname="gh-runner-$env:GITHUB_RUN_ID"

          $tsIP = $null$retries = 0
          while (-not $tsIP -and$retries -lt 12) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Start-Sleep -Seconds 3
          $testResult = Test-NetConnection -ComputerName$env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host "`n=============================="
          Write-Host "RDP ADDRESS : $env:TAILSCALE_IP"
          Write-Host "USERNAME    : RDP"
          Write-Host "PASSWORD    : $env:RDP_PASS"
          Write-Host "==============================`n"

          while ($true) {
              Write-Host "[$(Get-Date)] Runner active - Keepalive ping"
              Start-Sleep -Seconds 300
          }
